# sert, the shared test toolkit (github.com/kohltastrophe/sert): `python3 tools/sert.py <command>`.
#
#   fetch                 the pinned sert package and luau into .sert/ (gitignored)
#   run [-a ARGS]         the headless suite ([test].entries; ARGS go to test/spec.client.luau)
#   studio                the suite in a fresh, unattended Studio (edit mode)
#   lint / types / mutate static checks, compile-time type tests, and mutation testing
#   coverage --min 95     line coverage after `run --coverage`
#
# Work against a sert checkout: put `[override] sert = "../sert"` in sert.local.toml (gitignored).

[sert]
version = "0.1.0"

[tools]
luau = "0.724"

[test]
entries = ["test/spec.client.luau"]
stage = "default.project.json"

[coverage]
min = 95
include = ["src"]

[mutate]
min = 85
include = ["src"]

[lint]
paths = ["src", "test"]
project = "test/default.project.json"
solvers = ["new", "old"]
selene = false
registration = { aggregator = "test/unit/init.luau", specs = "test/unit/*.spec.luau" }

[types]
pass = ["test/types"]
fail = ["test/types/fail"]
solvers = ["new", "old"]

[cloud]
project = "test/default.project.json"
script = "test/spec.client.luau"

[studio]
mode = "edit"
project = "test/default.project.json"
config = "ReplicatedStorage/HyperLogLog.Tests"
specs = ["test/unit/*.spec.luau"]
out = "build/sert"
runner = "ReplicatedStorage/sert/roblox/Runner"
timeout = 120
