name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  check:
    if: github.event_name != 'schedule'
    name: Lint, Coverage & Mutation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false

      - uses: kohltastrophe/sert/actions/setup@v0.1.0

      - name: sert lint
        run: python3 tools/sert.py lint

      - name: sert run
        run: python3 tools/sert.py run --coverage

      - name: sert coverage
        run: python3 tools/sert.py coverage --min 95 --badge

      - name: sert mutate
        run: python3 tools/sert.py mutate --no-coverage-run --min 85

      - name: Update coverage badge
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/sert.py coverage --badge-branch --badge-push

  roblox:
    if: github.event_name != 'schedule'
    name: Roblox (Open Cloud)
    runs-on: ubuntu-latest
    environment: testing
    timeout-minutes: 30
    concurrency:
      group: luau-execution
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: kohltastrophe/sert/actions/setup@v0.1.0

      - name: Build the place
        run: rojo build test/default.project.json --output "$RUNNER_TEMP/sert-cloud.rbxl"

      - name: sert cloud
        env:
          ROBLOX_API_KEY: ${{ secrets.ROBLOX_API_KEY }}
          ROBLOX_UNIVERSE_ID: ${{ secrets.ROBLOX_UNIVERSE_ID || secrets.ROBLOX_TEST_UNIVERSE_ID }}
          ROBLOX_PLACE_ID: ${{ secrets.ROBLOX_PLACE_ID || secrets.ROBLOX_TEST_PLACE_ID }}
        run: python3 tools/sert.py cloud --place "$RUNNER_TEMP/sert-cloud.rbxl" --script test/spec.client.luau

  exhaustive:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    name: Exhaustive Properties
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: kohltastrophe/sert/actions/setup@v0.1.0
        with:
          rokit: "false"

      - name: sert run --exhaustive
        run: python3 tools/sert.py run --exhaustive
