# Release HyperLogLog. kohltastrophe/release keeps a release PR open on main that bumps wally.toml and CHANGELOG.md;
# merging it tags v<version>, builds the .rbxm and Wally package, creates the GitHub release, updates the `dist`
# branch, and publishes to Wally.
name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and package only; no GitHub release, no Wally publish
        type: boolean
        default: true

permissions:
  contents: write
  pull-requests: write
  actions: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Release PR or Release
        id: release
        uses: kohltastrophe/release@v1
        with:
          wait-for-ci: ci.yml

      - uses: CompeyDev/setup-rokit@1d9390883f7ebce19d48f5b8d006e11d387c92ab # v0.2.1
        if: steps.release.outputs.should_build == 'true'
        with:
          version: v1.2.0

      - name: Build the release assets
        if: steps.release.outputs.should_build == 'true'
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          mkdir -p dist
          rojo build default.project.json --output dist/HyperLogLog.rbxm
          wally package --list
          wally package --output "$RUNNER_TEMP/wally.zip"
          size=$(stat -c %s "$RUNNER_TEMP/wally.zip")
          echo "Wally package: $size bytes (the registry refuses more than 2 MiB)"
          [ "$size" -le 2097152 ]
          cp "$RUNNER_TEMP/wally.zip" "dist/HyperLogLog-$VERSION-package.zip"

      - name: Create GitHub release
        if: steps.release.outputs.should_build == 'true'
        uses: kohltastrophe/release@v1
        with:
          mode: publish
          title: HyperLogLog {version}
          checksums: dist/SHA256SUMS
          files: |
            dist/HyperLogLog.rbxm
            dist/HyperLogLog-{version}-package.zip

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always() && steps.release.outputs.should_build == 'true'
        with:
          name: release
          path: dist/
          if-no-files-found: error
          overwrite: true

      - name: Update dist branch
        if: steps.release.outputs.should_release == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin dist > /dev/null; then
            git fetch --no-tags origin refs/heads/dist:refs/heads/dist
          fi
          python3 tools/sert.py dist --from "$GITHUB_SHA"
          git log -1 --format='%H %s' refs/heads/dist --
          git push origin refs/heads/dist:refs/heads/dist

      - name: Publish kohltastrophe/hyperloglog to Wally
        if: steps.release.outputs.should_release == 'true'
        env:
          WALLY_AUTH_TOKEN: ${{ secrets.WALLY_AUTH_TOKEN }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          if [ -z "$WALLY_AUTH_TOKEN" ]; then echo "::notice::No WALLY_AUTH_TOKEN secret: Wally publish skipped"; exit 0; fi
          wally login --token "$WALLY_AUTH_TOKEN"
          # `wally publish` exits 0 even when the registry refuses the package, so read what it printed.
          output=$(wally publish 2>&1) || { echo "$output"; exit 1; }
          echo "$output"
          case "$output" in
            *"published successfully"*) ;;
            *"already exists"*) echo "::notice::kohltastrophe/hyperloglog@$VERSION was already on Wally" ;;
            *) echo "::error::Wally did not accept kohltastrophe/hyperloglog@$VERSION"; exit 1 ;;
          esac
